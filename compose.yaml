services:
  # A single KRaft node acting as both broker and controller.
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    networks: [crawler]
    ports: ["127.0.0.1:19092:19092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Runs once: creates the topics on the broker, then exits.
  kafka-init:
    image: apache/kafka:4.4.0
    networks: [crawler]
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"
    volumes: ["./infra/kafka/create-topics.sh:/create-topics.sh:ro"]
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:9092
      PARTITIONS: ${CRAWLER_TOPIC_PARTITIONS:-64}
      REPLICATION: ${CRAWLER_TOPIC_REPLICATION_FACTOR:-1}
      RETENTION: ${CRAWLER_INCOMING_RETENTION_BYTES:-104857600}

  unbound:
    build: infra/unbound
    networks:
      crawler: { ipv4_address: 172.28.0.53 }
    # TCP because Colima's SSH port forwarding cannot carry UDP.
    ports: ["127.0.0.1:15353:53/tcp"]
    healthcheck:
      test: ["CMD", "drill", "site1.test", "@127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

  synthetic-web:
    build:
      context: .
      dockerfile: synthetic-web/Dockerfile
    networks:
      crawler: { ipv4_address: 172.28.0.10 }
    ports: ["127.0.0.1:8080:80"]
    environment:
      JAVA_OPTS: -Xmx256m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  crawler:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  kafka-data:
