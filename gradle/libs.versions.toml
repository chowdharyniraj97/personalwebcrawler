[versions]
crawler-commons = "1.6"
google-java-format = "2.0.0"
gradle-protobuf = "0.10.1"
junit = "6.1.3"
kafka = "4.4.0"
logback = "1.6.6"
lombok = "1.18.48"
protobuf = "4.36.2"
slf4j = "2.0.20"
spotless = "8.11.0"
xxhash = "2026.0"

[libraries]
crawler-commons = { module = "com.github.crawler-commons:crawler-commons", version.ref = "crawler-commons" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
xxhash = { module = "net.openhft:zero-allocation-hashing", version.ref = "xxhash" }

[plugins]
protobuf = { id = "com.google.protobuf", version.ref = "gradle-protobuf" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
